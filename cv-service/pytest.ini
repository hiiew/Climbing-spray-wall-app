[pytest]
testpaths      = tests
python_files   = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode for FastAPI async endpoints
asyncio_mode = auto

# Show 20 slowest tests
# addopts = --durations=20

# Markers
markers =
    unit: Pure unit tests (no I/O)
    integration: Tests requiring a running service
    slow: Tests that take > 5 seconds
    gpu: Tests requiring a GPU (skip in CI)

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning:torch.*
